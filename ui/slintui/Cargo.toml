[package]
name = "slintui"
version = "0.1.0"
edition = "2021"

[dependencies]
derive_more = { version = "2.1.1", features = ["constructor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["full"] }

# --- ui deps ---
rand = "0.9"
#slint = "1.14.1"
slint = { version = "1.14.1", features = ["renderer-skia"] }
tokio-util = "0.7.18"
async-compat = "0.2.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
slint-build = "1.14.1"
